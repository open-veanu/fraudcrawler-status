owner: open-veanu
repo: fraudcrawler-status
user-agent: open-veanu

# Only these repo secrets are passed to the checks.
secrets:
  - SUPABASE_PROD_ANON_KEY
  - SUPABASE_TEST_ANON_KEY

# Downtime issues are opened automatically and assigned here.
assignees:
  - alho94

sites:
  # ---------- Production ----------
  - name: "Production: Web app"
    slug: prod-web
    url: https://fraudcrawler.veanu.ch/favicon.png  # static file: bypasses geo-block (CH/DE only) in middleware.ts
    maxResponseTime: 5000

  - name: "Production: Backend API"
    slug: prod-backend
    url: https://confidential-fraudcrawler-backend.fly.dev/health
    maxResponseTime: 5000
    __dangerous__body_down_if_text_missing: '"status": "healthy"'
    __dangerous__body_degraded_if_text_missing: '"redis_connected": true'

  - name: "Production: Database & Auth"
    slug: prod-supabase
    url: https://hgmlcybbubypbrlcpqaq.supabase.co/auth/v1/health
    headers:
      - "apikey: $SUPABASE_PROD_ANON_KEY"
    maxResponseTime: 5000

  # ---------- Dev/Test (shared Supabase + Fly backend) ----------
  - name: "Dev/Test: Web app"
    slug: test-web
    url: https://test.fraudcrawler.veanu.ch/favicon.png
    maxResponseTime: 5000

  - name: "Dev/Test: Backend API"
    slug: test-backend
    url: https://test-confidential-fraudcrawler-backend.fly.dev/health
    maxResponseTime: 5000
    __dangerous__body_down_if_text_missing: '"status": "healthy"'
    __dangerous__body_degraded_if_text_missing: '"redis_connected": true'

  - name: "Dev/Test: Database & Auth"
    slug: test-supabase
    url: https://ihpopzebgxgrnyeienkt.supabase.co/auth/v1/health
    headers:
      - "apikey: $SUPABASE_TEST_ANON_KEY"
    maxResponseTime: 5000

  # ---------- Upstream providers (degraded if they report any incident) ----------
  - name: "Upstream: Vercel"
    slug: upstream-vercel
    url: https://www.vercel-status.com/api/v2/status.json
    __dangerous__body_degraded_if_text_missing: '"indicator":"none"'

  - name: "Upstream: Supabase"
    slug: upstream-supabase
    url: https://status.supabase.com/api/v2/status.json
    __dangerous__body_degraded_if_text_missing: '"indicator":"none"'

  - name: "Upstream: Fly.io"
    slug: upstream-flyio
    url: https://status.flyio.net/api/v2/status.json
    __dangerous__body_degraded_if_text_missing: '"indicator":"none"'

status-website:
  themeUrl: /fraudcrawler.css
  cname: status.fraudcrawler.veanu.ch
  logoUrl: https://fraudcrawler.veanu.ch/logo.png
  favicon: https://fraudcrawler.veanu.ch/favicon.png
  name: Status
  logoHref: /
  introTitle: "**Fraudcrawler** system status"
  introMessage: Real-time availability of the Fraudcrawler web app, backend and database, checked every 5 minutes. Incidents and planned maintenance are announced here.
  navbar:
    - title: Status
      href: /
    - title: Fraudcrawler
      href: https://fraudcrawler.veanu.ch

# Optional: post up/down alerts to Discord. Add these two repo secrets
# AND list both names under `secrets:` at the top of this file:
#   NOTIFICATION_DISCORD=true
#   NOTIFICATION_DISCORD_WEBHOOK_URL=<webhook url>
