# Not generated by Upptime. Keep this file.
#
# The status page renders issue comments as unsanitized HTML, so a comment from
# any GitHub user would appear (and could run script) on status.fraudcrawler.veanu.ch.
# Locking restricts comments to repo collaborators. No untrusted code is checked out.
name: Lock incident issues
on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:
permissions:
  issues: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - name: Lock the new issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
        run: gh issue lock "$NUMBER" -R "$REPO" || true
      - name: Lock all existing issues
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          for n in $(gh issue list -R "$REPO" --state all --limit 1000 --json number --jq '.[].number'); do
            gh issue lock "$n" -R "$REPO" || true
          done
